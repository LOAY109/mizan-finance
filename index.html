<!DOCTYPE html>
<html lang="ar" dir="rtl">

  <meta name="theme-color" content="#F5F4F0" id="meta-theme-color">

  <!-- iOS & Mobile PWA Support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
